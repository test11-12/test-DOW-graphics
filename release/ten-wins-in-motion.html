ones at once, and that all 61 flown that day came down.",title:"Forty-nine drones. One pulse.",prompt:"Count what is still flying after the pulse.",sources:[{label:"Epirus, 10 Sep 2025",url:"https://epirusinc.com/press-releases/epirus-leonidas-high-power-microwave-defeats-49-drone-swarm-100-of-drones-flown-at-live-fire-demonstration"},{label:"Axios, 28 Aug 2025",url:"https://www.axios.com/2025/08/28/epirus-indiana-drone-swarm-demo-leonidas"}],caveat:"The 61-of-61 count is Epirus\u2019s own, from an invitation-only demonstration. Axios, the only press present, reported the 49-drone finale. No independent tally has been published."},{id:"ward-250",name:"Ward 250",category:"Land",maker:"Valar Atomics",place:"California to Utah",when:"February 2026",description:"The Air Force loaded a privately built nuclear reactor into three C-17s and flew it nearly 700 miles. Four months later it went critical.",title:"A reactor that ships like cargo.",prompt:"Watch the clock, then the calendar.",sources:[{label:"PBS NewsHour, 21 Feb 2026",url:"https://www.pbs.org/newshour/nation/u-s-military-airlifts-small-reactor-for-the-first-time-as-trump-pushes-to-quickly-deploy-nuclear-power"},{label:"Nuclear Newswire, 22 Jun 2026",url:"https://www.ans.org/news/2026-06-22/article-8136/valars-ward-250-reaches-criticality-in-utah/"},{label:"New Atlas",url:"https://newatlas.com/military/us-air-force-airlifts-complete-nuclear-reactor"}],caveat:"The reactor flew without fuel. Reports of its power rating differ, so none is shown. Criticality here is a zero-power chain reaction, announced by the Energy Department on June 18, 2026."},{id:"talon-a2",name:"Talon-A2",category:"Air",maker:"Stratolaunch",place:"Pacific Ocean to Vandenberg",when:"December 2024 and March 2025",description:"A rocket plane dropped from the world\u2019s widest aircraft, passed Mach 5 and landed itself on a runway. Then the same airframe did it again.",title:"Hypersonic, and it comes back.",prompt:"Follow one airframe through two flights.",sources:[{label:"Stratolaunch, 5 May 2025",url:"https://www.stratolaunch.com/news/stratolaunch-successfully-completes-reusable-hypersonic-flight-and-recovery-with-talon-a2-vehicle/"},{label:"The Aviationist, 6 May 2025",url:"https://theaviationist.com/2025/05/06/stratolaunch-tests-talon-a2-reusable-hypersonic-flight/"}],caveat:"Stratolaunch has not released top speeds, altitudes or distances. Both flights passed Mach 5 and the second was faster. The profile is schematic."},{id:"varda-w5",name:"Varda W-5",category:"Space",maker:"Varda Space Industries",place:"Koonibba, South Australia",when:"January 2026",description:"A capsule spent 63 days in orbit, hit the atmosphere at about 30,000 km/h and landed under a parachute in the Australian outback.",title:"Every landing is a hypersonic flight test.",prompt:"The streak across the sky is the experiment.",sources:[{label:"Space Connect",url:"https://www.spaceconnectonline.com.au/discovery/6934-community-and-astrophotographer-capture-spectacular-return-of-varda-space-capsule-over-sa"},{label:"Southern Launch",url:"https://www.southernlaunch.space/news-feed/southern-launch-supports-third-orbital-re-entry-in-12-months-to-koonibba-test-range"},{label:"Varda, W-5 mission page",url:"https://www.varda.com/mission/w-5"}],caveat:"Speed figures are Varda\u2019s and Southern Launch\u2019s. Varda says only that the payload was for the US Navy. The sky and the track are schematic."},{id:"lucas",name:"LUCAS",category:"Sea",maker:"SpektreWorks",place:"Arabian Gulf",when:"December 2025",description:"A Navy warship launched a one-way attack drone from its flight deck for the first time. The drone reportedly costs about $35,000.",title:"Any flight deck is a launch pad.",prompt:"Watch the booster fall away.",sources:[{label:"Ground News roundup",url:"https://ground.news/article/in-a-first-a-us-navy-warship-in-the-middle-east-just-launched-a-one-way-attack-drone"},{label:"The War Zone, 18 Dec 2025",url:"https://www.twz.com/air/amer
