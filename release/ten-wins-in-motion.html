 one 16 hours and 42 minutes later. Then one satellite ran down another that was trying to get away.",title:"Sixteen hours to launch. Then the chase.",prompt:"First the clock. Then the lime one hunts.",sources:[{label:"True Anomaly, 29 Jul 2026",url:"https://www.trueanomaly.space/newsroom/victus-haze-mission-update-jackal-hunts-puma"},{label:"True Anomaly, 1 Jul 2026",url:"https://www.trueanomaly.space/newsroom/first-victus-haze-mission-complete"},{label:"Rocket Lab, 22 Jun 2026",url:"https://investors.rocketlabcorp.com/news-releases/news-release-details/rocket-lab-shatters-responsive-space-record-launches-us-space"},{label:"DefenseScoop, 23 Jun 2026",url:"https://defensescoop.com/2026/06/23/space-force-victus-haze-launch-rocket-lab/"}],caveat:"Orbits, distances and closest approach were not released, so the geometry is schematic. Times are from the Space Force, Rocket Lab and True Anomaly."},{id:"blackbeard",name:"Blackbeard",category:"Air",maker:"Castelion",place:"US Navy flight test",when:"September 2026",description:"A startup\u2019s hypersonic missile flew under the wings of a Navy Super Hornet. The first production lot is 444 rounds. The Pentagon wants 12,000.",title:"Hypersonic, by the thousand.",prompt:"Every dot is one missile. The lit ones are on order.",sources:[{label:"The War Zone, 25 Sep 2026",url:"https://www.twz.com/air/blackbeard-hypersonic-missile-seen-flying-on-f-a-18-super-hornet-for-the-first-time"},{label:"Department of War, 13 May 2026",url:"https://www.war.gov/news/Releases/Release/Article/4485332/department-of-war-enhances-lethal-strike-capacity-through-partnership-with-new/"},{label:"Naval News, 16 Sep 2026",url:"https://www.navalnews.com/naval-news/2026/09/castelion-secures-u-s-navy-production-order-for-blackbeard-hypersonic-weapon/"}],caveat:"The Navy has not given a speed or said whether one has been launched from the jet. No price per round has been published. The 12,000 is a goal the Pentagon is seeking money for; its commitment is at
